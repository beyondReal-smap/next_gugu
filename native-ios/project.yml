name: Gugu
options:
  bundleIdPrefix: site.smap
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "18"
    DEVELOPMENT_TEAM: ZVXXRV5MTP
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Gugu:
    type: application
    platform: iOS
    sources:
      - path: Gugu
    info:
      path: Gugu/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "구구 어드벤처"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        SupabaseHost: "$(SUPABASE_HOST)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
        UIAppFonts:
          - SUITE-Light.ttf
          - SUITE-Regular.ttf
          - SUITE-Medium.ttf
          - SUITE-SemiBold.ttf
          - SUITE-Bold.ttf
          - SUITE-ExtraBold.ttf
          - SUITE-Heavy.ttf
    # Supabase 값은 Config.xcconfig(gitignore)에서 읽는다. 없으면 빈 값으로 빌드되고
    # 앱은 인증 없이 그대로 동작한다 (SupabaseConfig.isConfigured == false)
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.smap.gugudan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  GuguTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GuguTests
    dependencies:
      - target: Gugu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Gugu:
    build:
      targets:
        Gugu: all
    run:
      config: Debug
      storeKitConfiguration: Gugu.storekit
    test:
      config: Debug
      targets:
        - GuguTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
